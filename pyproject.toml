[project]
name = "nrelief"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "julianolorenzato", email = "julianolorenzato@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "torch",
    "numpy",
    "slangpy>=0.43.1",
    "typer>=0.29.1",
    "open3d>=0.20.0",
    "numba>=0.68.1",
]

[tool.ruff]
line-length = 100
lint.ignore = ["B008"]

[project.scripts]
nrelief = "nrelief:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
